# Loja Desejo de Intimidade no Cloudflare (Worker + arquivos do site + banco D1).
# Publicada pelo GitHub (.github/workflows/loja.yml).
name = "desejo-de-intimidade"
main = "worker/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/_api/*", "/_cdn/up/*", "/sitemap.xml"]

[[d1_databases]]
binding = "DB"
database_name = "loja"
database_id = "__D1_ID__" # o workflow troca pelo id real
migrations_dir = "migrations"

[alias]
"@floot/push" = "./shims/floot-push.ts"
"@floot/storage" = "./shims/floot-storage.ts"
"@floot/email" = "./shims/floot-email.ts"
"@floot/prefetch" = "./shims/floot-prefetch.ts"

[observability]
enabled = true
