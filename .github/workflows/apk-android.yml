name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos do app
        run: |
          npm run build
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk desejo-de-intimidade-teste.apk
          gh release delete teste-android --yes --cleanup-tag || true
          gh release create teste-android desejo-de-intimidade-teste.apk \
            --prerelease \
            --title "APK de teste (Android)" \
            --notes "Versão de teste gerada em $(date -u +'%d/%m/%Y %H:%M') UTC. Baixe o arquivo .apk abaixo e abra no celular Android para instalar."

      - uses: actions/upload-artifact@v4
        with:
          name: apk-teste
          path: desejo-de-intimidade-teste.apk
