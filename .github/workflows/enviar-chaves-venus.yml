name: Enviar chaves para a Vênus

# Entrega GROQ_API_KEY, TAVILY_API_KEY e GEMINI_API_KEY (segredos deste repositório) ao servidor
# da Vênus no Cloudflare (Worker "venus-servidor", publicado pelo repositório Sexta-feira-).
# Rode pela aba Actions sempre que trocar alguma dessas chaves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar:
    # trava: só o dono do GitHub dispara
    if: github.actor == 'tonysantquees95-code'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVIDOR: venus-servidor
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir se o servidor da Vênus está nesta conta do Cloudflare
        run: |
          codigo=$(curl -s -o resposta.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$SERVIDOR/settings")
          if [ "$codigo" != "200" ]; then
            echo "::error::Não achei o servidor $SERVIDOR nesta conta do Cloudflare (HTTP $codigo). Publique o Sexta-feira- primeiro ou confira se as duas contas são a mesma."
            head -c 400 resposta.json; echo
            exit 1
          fi
          echo "Servidor $SERVIDOR encontrado."

      - name: Enviar as chaves
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          falhou=0
          for nome in GROQ_API_KEY TAVILY_API_KEY GEMINI_API_KEY MERCADOPAGO_ACCESS_TOKEN; do
            valor="${!nome}"
            if [ -z "$valor" ]; then
              echo "::error::$nome está vazia nos segredos deste repositório."
              falhou=1
              continue
            fi
            printf '%s' "$valor" | npx --yes wrangler@4 secret put "$nome" --name "$SERVIDOR"
            echo "$nome enviada."
          done
          exit $falhou
