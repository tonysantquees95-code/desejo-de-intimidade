name: Loja (conferir páginas)

# Tira fotos das páginas da loja nova (Cloudflare) e da antiga (Floot) e guarda no ramo "conferencia".
on:
  workflow_dispatch:
    inputs:
      paginas:
        description: "Páginas separadas por vírgula (vazio = as principais)"
        required: false
        default: ""
      so_nova:
        description: "1 = só a loja nova"
        required: false
        default: ""
  workflow_run:
    workflows: ["Loja (Cloudflare)"]
    types: [completed]

permissions:
  contents: write

jobs:
  conferir:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fotos das páginas
        env:
          PAGINAS: ${{ github.event.inputs.paginas }}
          SO_NOVA: ${{ github.event.inputs.so_nova }}
        run: |
          mkdir -p /tmp/conf && cd /tmp/conf
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/loja/scripts/conferir.mjs" .
          node conferir.mjs saida
      - name: Guardar no ramo conferencia
        run: |
          cd /tmp/conf/saida
          git init -q -b conferencia
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Conferência $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" conferencia
