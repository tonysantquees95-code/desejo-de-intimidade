<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão</title>
  <style>
    :root { --fundo: #000000; --texto: #ffffff; --suave: #c8c8c8; --destaque: #ff2e97; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--fundo); color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; text-align: center;
    }
    main { max-width: 340px; }
    .marca { font-size: 22px; font-weight: 700; letter-spacing: .5px; margin-bottom: 32px; color: var(--destaque); text-shadow: 0 0 12px rgba(255,46,151,.6); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: var(--suave); line-height: 1.5; margin: 0 0 28px; }
    button {
      background: var(--destaque); color: #0a0006; border: 0; border-radius: 999px;
      padding: 14px 32px; font-size: 16px; font-weight: 600; width: 100%;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <div class="marca">Desejo de Intimidade</div>
    <h1>Você está sem internet</h1>
    <p>Confira sua conexão e toque no botão abaixo para voltar à loja.</p>
    <button onclick="location.href='https://desejo-de-intimidade.floot.app/'">Tentar novamente</button>
  </main>
</body>
</html>
